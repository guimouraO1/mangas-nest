<div class="min-h-screen md:grid md:grid-cols-2 flex flex-wrap items-center justify-center h-screen flex-col raltive">
  <div class="md:w-full md:h-full bg-base-300">
    <div class="top-4 left-4 absolute flex items-center gap-2 flex-wrap">
      <span class="text-sm md:text-xl font-semibold text-base-content/15">Mangas nest</span>
    </div>
    
    <div class="flex flex-row items-center gap-6 absolute right-10 top-5">
      <label class="swap swap-rotate">
        <input type="checkbox" [checked]="this.themeService.getTheme() !== 'light'" (click)="this.themeService.toggleTheme()" />
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
          class="size-6 swap-on">
          <path
            d="M10 2a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 10 2ZM10 15a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 10 15ZM10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM15.657 5.404a.75.75 0 1 0-1.06-1.06l-1.061 1.06a.75.75 0 0 0 1.06 1.06l1.06-1.06ZM6.464 14.596a.75.75 0 1 0-1.06-1.06l-1.06 1.06a.75.75 0 0 0 1.06 1.06l1.06-1.06ZM18 10a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 18 10ZM5 10a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 5 10ZM14.596 15.657a.75.75 0 0 0 1.06-1.06l-1.06-1.061a.75.75 0 1 0-1.06 1.06l1.06 1.06ZM5.404 6.464a.75.75 0 0 0 1.06-1.06l-1.06-1.06a.75.75 0 1 0-1.061 1.06l1.06 1.06Z" />
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"
          class="size-6 swap-off">
          <path fill-rule="evenodd"
            d="M7.455 2.004a.75.75 0 0 1 .26.77 7 7 0 0 0 9.958 7.967.75.75 0 0 1 1.067.853A8.5 8.5 0 1 1 6.647 1.921a.75.75 0 0 1 .808.083Z"
            clip-rule="evenodd" />
        </svg>
      </label>
      <div class="flex cursor-pointer" (click)="languageService.setLanguage(languageService.getLanguage() === 'pt-br' ? 'en' : 'pt-br')">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="m10.5 21 5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 0 1 6-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 0 1-3.827-5.802" />
        </svg>
      </div>
    </div>
  </div>
  <div class="flex justify-center items-center sm:h-screen sm:w-full md:col-start-2">
    <form [formGroup]="signInForm" (ngSubmit)="signIn()" class="h-screen w-full flex flex-col gap-4 items-center justify-center p-10 rounded-sm">
      <div class="flex flex-col items-center justify-center">
        <span class="text-3xl md:text-5xl font-bold text-neutral">{{ 'pages.sign-in.form.title' | translate }}</span>
        <span class="text-sm  font-extralight text-base-content/60">{{ 'pages.sign-in.form.subtitle' | translate }}</span>
      </div>

      <div class="w-full md:w-1/2 mt-6">
        <label>{{ 'pages.sign-in.form.email' | translate }}</label>
        <label class="input w-full focus-within:outline-none focus-within:border-neutral">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6">
            <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
            <path d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
          </svg>
          <input formControlName="email" type="email" class="grow" placeholder="{{ 'pages.sign-in.form.emailPlaceholder' | translate }}" />
        </label>
      </div>

      <div class="w-full md:w-1/2">
        <label>{{ 'pages.sign-in.form.password' | translate }}</label>
        <label class="input w-full focus-within:outline-none focus-within:border-neutral">
          @if (isPasswordVisible) {
            <svg (click)="togglePasswordVisibility()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 cursor-pointer">
              <path d="M3.53 2.47a.75.75 0 0 0-1.06 1.06l18 18a.75.75 0 1 0 1.06-1.06l-18-18ZM22.676 12.553a11.249 11.249 0 0 1-2.631 4.31l-3.099-3.099a5.25 5.25 0 0 0-6.71-6.71L7.759 4.577a11.217 11.217 0 0 1 4.242-.827c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113Z" />
              <path d="M15.75 12c0 .18-.013.357-.037.53l-4.244-4.243A3.75 3.75 0 0 1 15.75 12ZM12.53 15.713l-4.243-4.244a3.75 3.75 0 0 0 4.244 4.243Z" />
              <path d="M6.75 12c0-.619.107-1.213.304-1.764l-3.1-3.1a11.25 11.25 0 0 0-2.63 4.31c-.12.362-.12.752 0 1.114 1.489 4.467 5.704 7.69 10.675 7.69 1.5 0 2.933-.294 4.242-.827l-2.477-2.477A5.25 5.25 0 0 1 6.75 12Z" />
            </svg>
            } @else {
              <svg (click)="togglePasswordVisibility()" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 cursor-pointer">
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                <path fill-rule="evenodd" d="M1.323 11.447C2.811 6.976 7.028 3.75 12.001 3.75c4.97 0 9.185 3.223 10.675 7.69.12.362.12.752 0 1.113-1.487 4.471-5.705 7.697-10.677 7.697-4.97 0-9.186-3.223-10.675-7.69a1.762 1.762 0 0 1 0-1.113ZM17.25 12a5.25 5.25 0 1 1-10.5 0 5.25 5.25 0 0 1 10.5 0Z" clip-rule="evenodd" />
              </svg>
            }
          <input formControlName="password" [type]="isPasswordVisible ? 'text' : 'password'" class="grow" placeholder="{{ 'pages.sign-in.form.passwordPlaceholder' | translate }}" />
        </label>
      </div>

      <button type="submit" [disabled]="this.signInForm.invalid || isLoading" class="btn btn-neutral btn-soft btn-wide">{{ 'pages.sign-in.form.button' | translate }}</button>
    </form>
  </div>

  <span class="bottom-4 left-4 absolute text-xs text-base-content/50">Guilherme de Moura Oliveira - Copyright &copy; 2025</span>
</div>
