<div class="h-16 flex items-center justify-between px-3 md:px-10 border-b-1 border-base-content/5">
    <div class="h-full items-center hidden md:flex">
      <span class="text-sm md:text-xl font-semibold text-base-content/40 select-none">Mangas nest</span>
    </div>
    
    <div class="h-full hidden md:flex items-center gap-2 justify-center">
      <button routerLinkActive="btn-neutral btn-soft" routerLink='subscriptions' class="btn">{{'components.navbar.pages.subscriptions' | translate }}</button>
      <button routerLinkActive="btn-neutral btn-soft" routerLink='mangas' class="btn">{{'components.navbar.pages.mangas' | translate }}</button>
    </div>

    <div class="dropdown dropdown-start md:hidden">
      <svg tabindex="0" xmlns="http://www.w3.org/2000/svg" 
        fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 cursor-pointer ml-2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
      <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm gap-2">
        <li><button routerLinkActive="btn-neutral btn-active" routerLink='subscriptions' class="btn btn-soft">{{'components.navbar.pages.subscriptions' | translate }}</button></li>
        <li><button routerLinkActive="btn-neutral btn-active" routerLink='mangas' class="btn btn-soft">{{'components.navbar.pages.mangas' | translate }}</button></li>
      </ul>
    </div>

    <div class="h-full flex items-center gap-4 justify-end select-none self-end">
      <div class="flex pl-1.5 gap-1.5">
        <label class="swap swap-rotate">
          <input type="checkbox" [checked]="this.themeService.getTheme() !== 'light'" (click)="this.themeService.toggleTheme()"/>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-6 swap-on">
            <path d="M10 2a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 10 2ZM10 15a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 10 15ZM10 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM15.657 5.404a.75.75 0 1 0-1.06-1.06l-1.061 1.06a.75.75 0 0 0 1.06 1.06l1.06-1.06ZM6.464 14.596a.75.75 0 1 0-1.06-1.06l-1.06 1.06a.75.75 0 0 0 1.06 1.06l1.06-1.06ZM18 10a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 18 10ZM5 10a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 5 10ZM14.596 15.657a.75.75 0 0 0 1.06-1.06l-1.06-1.061a.75.75 0 1 0-1.06 1.06l1.06 1.06ZM5.404 6.464a.75.75 0 0 0 1.06-1.06l-1.06-1.06a.75.75 0 1 0-1.061 1.06l1.06 1.06Z" />
          </svg>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-6 swap-off">
            <path fill-rule="evenodd" d="M7.455 2.004a.75.75 0 0 1 .26.77 7 7 0 0 0 9.958 7.967.75.75 0 0 1 1.067.853A8.5 8.5 0 1 1 6.647 1.921a.75.75 0 0 1 .808.083Z" clip-rule="evenodd" />
          </svg>
        </label>
      </div>

        <div class="flex cursor-pointer" (click)="languageService.setLanguage(languageService.getLanguage() === 'pt-br' ? 'en' : 'pt-br')">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="m10.5 21 5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 0 1 6-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 0 1-3.827-5.802" />
          </svg>
        </div>

      <button class="btn btn-soft btn-error" (click)="signOut()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25" />
        </svg>        
      </button>
    </div>

</div>
